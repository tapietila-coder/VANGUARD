[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard"
version = "0.1.0"
description = "VANGUARD: D27HQ Infrastructure & Operational Readiness Directorate — local reference service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.7,<3", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
detect = ["psutil>=6,<7"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["vanguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
